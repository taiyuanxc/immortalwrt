name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git --depth=1 openwrt

      - name: Add your config
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_ipq60xx=y
          CONFIG_TARGET_ipq60xx_generic=y
          CONFIG_TARGET_ipq60xx_generic_DEVICE_zn_m2=y
          CONFIG_LINUX_5_15=y
          CONFIG_PACKAGE_kmod-ath11k=n
          CONFIG_PACKAGE_kmod-qca-wifi=n
          CONFIG_PACKAGE_wpad-full=n
          CONFIG_PACKAGE_ath11k-firmware=n
          CONFIG_PACKAGE_nss-firmware=y
          CONFIG_PACKAGE_kmod-nss=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-store=y
          EOF

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Make config
        run: |
          cd openwrt
          make defconfig

      - name: Download dependencies
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: openwrt/bin/targets/ipq60xx/generic/*.bin
